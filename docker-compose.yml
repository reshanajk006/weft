services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./weft.db
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175

  # Optional PostgreSQL. To switch, uncomment this service and set:
  # DATABASE_URL=postgresql+psycopg://weft:weft@postgres:5432/weft
  # postgres:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: weft
  #     POSTGRES_PASSWORD: weft
  #     POSTGRES_DB: weft
  #   ports:
  #     - "5432:5432"
